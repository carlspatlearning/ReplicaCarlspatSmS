<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="94" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="6" />
  
  <!-- Inner Dashed Ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3" opacity="0.7" />

  <!-- Shield Shape -->
  <path d="M60,65 Q100,55 140,65 Q140,110 100,145 Q60,110 60,65 Z" fill="#ffffff" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Open Book Symbol -->
  <path d="M72,112 C82,106 95,107 100,112 C105,107 118,106 128,112 L128,126 C118,120 105,121 100,126 C95,121 82,120 72,126 Z" fill="url(#goldGrad)" />
  <path d="M100,112 L100,126" stroke="#1e3a8a" stroke-width="2" />

  <!-- Academic Torch / Star -->
  <circle cx="100" cy="85" r="8" fill="#fbbf24" />
  <polygon points="100,70 103,78 111,78 105,83 107,91 100,86 93,91 95,83 89,78 97,78" fill="url(#goldGrad)" />

  <!-- Monogram Initials -->
  <text x="100" y="103" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="2">SIS</text>

  <!-- Banner text bottom -->
  <text x="100" y="172" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#fbbf24" letter-spacing="1.5">SAMEN INT. SCHOOL</text>
</svg>
