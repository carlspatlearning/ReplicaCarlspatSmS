services:
  - type: web
    name: samen-sms-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build && npm prune --omit=dev
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CORS_ORIGIN
        value: https://samen-internationalschool.vercel.app,http://localhost:3000
      # Production uploads must use durable object storage. Without these,
      # Render's ephemeral filesystem loses logos/resources on each deploy.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SEED_ON_START
        value: "false"
